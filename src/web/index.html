<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>光栅交错图工作室</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>光栅交错图工作室</h1>
      <span class="sub">分条抖动 · 校准微调 · 手持转动预览 · 串帧分析</span>
    </header>

    <main>
      <aside class="panel" id="controls">
        <section>
          <h2>1. 素材</h2>
          <div class="row">
            <label class="check"><input type="radio" name="mode" value="frames" checked /> 2~6 帧变图</label>
            <label class="check"><input type="radio" name="mode" value="stereo" /> 左右眼立体对</label>
          </div>
          <input type="file" id="fileInput" accept="image/*" multiple />
          <div id="frameList" class="frame-list"><span class="hint">未导入（也可用下方演示素材）</span></div>
          <div class="row">
            <button id="demoBtn" class="ghost">生成演示帧</button>
            <button id="clearFramesBtn" class="ghost">清空</button>
          </div>
        </section>

        <section>
          <h2>2. 光栅板参数</h2>
          <label>标称线数 LPI <input type="number" id="lpi" value="100" step="0.1" min="10" max="400" /></label>
          <label>板厚 mm <input type="number" id="thickness" value="0.58" step="0.01" min="0.05" max="5" /></label>
          <label>折射率 <input type="number" id="index" value="1.57" step="0.01" min="1.3" max="2" /></label>
          <label>设计观看距离 mm <input type="number" id="distance" value="350" step="10" min="100" max="2000" /></label>
          <label>印刷分辨率 DPI <input type="number" id="dpi" value="2400" step="1" min="150" max="4800" /></label>
          <label>透镜模糊 σ（条宽分数）<input type="number" id="blur" value="0.18" step="0.02" min="0.02" max="0.8" /></label>
        </section>

        <section>
          <h2>3. 线数校准</h2>
          <p class="hint">先打印校准图，贴板转动找到摩尔纹静止块，把该块 LPI 填入实测值。</p>
          <div class="row">
            <button id="calibBtn">导出校准图（A4）</button>
          </div>
          <label>实测线数 LPI（留空=理论补偿）<input type="number" id="measured" placeholder="例如 99.6" step="0.1" /></label>
          <div class="row">
            <button id="applyCalibBtn" class="ghost">回填标称值</button>
          </div>
        </section>

        <section>
          <h2>4. 输出</h2>
          <div class="row">
            <label>成品宽 mm <input type="number" id="outW" value="297" step="1" min="10" max="1000" /></label>
            <label>成品高 mm <input type="number" id="outH" value="210" step="1" min="10" max="1000" /></label>
          </div>
          <label>分条抖动
            <select id="dither">
              <option value="hash" selected>随机化误差扩散（推荐）</option>
              <option value="error">确定性误差传递</option>
              <option value="floor">直接取整（仅对照）</option>
            </select>
          </label>
          <label>模拟节距失配 % <input type="number" id="mismatch" value="0" step="0.05" min="-2" max="2" /></label>
          <button id="exportBtn" class="primary">生成并下载交错图 PNG</button>
          <div id="exportStatus" class="hint"></div>
        </section>
      </aside>

      <section class="panel stage">
        <div class="stage-toolbar">
          <div id="angleReadout" class="angle">角度 0.0°</div>
          <label class="check"><input type="checkbox" id="autoSwing" /> 自动摆动</label>
          <input type="range" id="angleSlider" min="-50" max="50" step="0.5" value="0" />
        </div>
        <div id="preview" class="preview"></div>

        <div class="alerts" id="alerts"></div>

        <div class="metrics" id="metrics"></div>

        <div class="chart-wrap">
          <h3>各帧可见权重 vs 观看角度</h3>
          <canvas id="chart"></canvas>
        </div>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
